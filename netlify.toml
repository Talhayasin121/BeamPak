[build]
  command = "npm test && npm run build:netlify"
  publish = "dist-netlify"

[build.environment]
  NODE_VERSION = "22"

[dev]
  framework = "#static"
  publish = "dist-netlify"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/products/multicolour-led-pod-kit"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/manage"
  to = "/manage.html"
  status = 200

[[headers]]
  for = "/media/fast/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' https://www.facebook.com https://connect.facebook.net; connect-src 'self' https://www.facebook.com https://connect.facebook.net; media-src https://videos.pexels.com; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
